```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Madhu ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0710;
            color: white;
            font-family: Georgia, serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .container {
            padding: 30px;
            animation: fadeIn 2s ease;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.75;
            margin-bottom: 35px;
        }

        button {
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            color: #0b0710;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Heyy Beautiful ✨</h1>

        <p>
            I made something little for you...
        </p>

        <button onclick="startJourney()">
            Tap here 🤍
        </button>
    </div>

    <script>
        function startJourney() {
            document.body.innerHTML = `
                <div class="container">
                    <h1>This is the day ✨</h1>
                    <p>
                        The day someone very special came into this world.
                    </p>
                </div>
            `;
        }
    </script>

</body>
</html>
